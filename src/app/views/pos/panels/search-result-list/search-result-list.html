<div id="search-result-container">
  <div id="header">
    <div class="header-cell">
      <p class="caption">Code</p>
    </div>
    <div class="header-cell">
      <p class="caption">Name</p>
    </div>
    <div class="header-cell">
      <p class="caption">Inventory</p>
    </div>
    <div class="header-cell">
      <p class="caption">Price</p>
    </div>
    <div class="header-cell">
      <p class="caption">Updated At</p>
    </div>
  </div>
  <ul id="list">
    @for (item of itemList(); track item.id) {
      <rm-list-item [item]="item" (onSelect)="onItemSelect($event)" />
    }
  </ul>
</div>
